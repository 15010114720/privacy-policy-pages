<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>黎江爱蔡艳 - 情人节快乐!!!</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+QingKe+HuangYou&display=swap">
<style>
/* 基础样式 */
* {margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
body {font-family: 'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
      background: linear-gradient(135deg,#0f0c29,#302b63,#24243e);
      color:white; min-height:100vh; min-height:-webkit-fill-available;
      overflow-x:hidden; display:flex; flex-direction:column; align-items:center; justify-content:center;
      position:relative; padding:20px; touch-action: manipulation;}
html {height:-webkit-fill-available;}

/* 粒子背景 */
.particles {position:fixed; top:0; left:0; width:100%; height:100%; z-index:1; pointer-events:none;}
@keyframes float {
    0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { transform: translateY(-120vh) translateX(20px) rotate(360deg); opacity: 0; }
}

/* 容器 */
.container {text-align:center; padding:15px; max-width:100%; width:100%; z-index:10; display:flex; flex-direction:column; align-items:center;}

/* 标题 */
.header {margin-bottom:25px; width:100%; position:relative; z-index:15;}
.title {font-size:4rem; margin-bottom:15px; background:linear-gradient(90deg,#ff8a00,#e52e71,#9d50bb);
        -webkit-background-clip:text; background-clip:text; color:transparent;
        text-shadow:0 0 20px rgba(229,46,113,0.5); animation:glow 5s ease-in-out infinite alternate;
        letter-spacing:1px; font-weight:800; line-height:1.2; font-family:'Ma Shan Zheng', cursive;
        word-break:keep-all; position:relative; z-index:20;}
@keyframes glow {
    from { text-shadow:0 0 15px rgba(229,46,113,0.4); filter: brightness(1); }
    to { text-shadow:0 0 25px rgba(229,46,113,0.7),0 0 35px rgba(157,80,187,0.5); filter: brightness(1.1); }
}
.subtitle {font-size:1.8rem; color:#a8e6cf; margin-bottom:10px; opacity:0; animation:fadeInUp 1.5s ease forwards 0.5s;
          line-height:1.4; font-weight:300; position:relative; z-index:20;}

/* 心形 */
.heart-container {position:relative; margin:30px auto; width:220px; height:220px; display:flex; align-items:center; justify-content:center; touch-action:none; z-index:15;}
.heart {position:absolute; background-color:#ff4757; width:110px; height:110px; transform:rotate(45deg); 
        animation:breath 2.5s ease-in-out infinite; box-shadow:0 0 40px rgba(255, 71, 87, 0.6); will-change:transform, box-shadow;}
.heart:before,.heart:after {content:""; position:absolute; width:110px; height:110px; background-color:#ff4757; border-radius:50%;}
.heart:before {top:-55px; left:0;}
.heart:after {top:0; left:-55px;}

/* 呼吸动画 - 替代原来的心跳 */
@keyframes breath {
    0% {transform:rotate(45deg) scale(1); box-shadow:0 0 30px rgba(255,71,87,0.5);}
    50% {transform:rotate(45deg) scale(1.15); box-shadow:0 0 60px rgba(255,71,87,0.9);}
    100% {transform:rotate(45deg) scale(1); box-shadow:0 0 30px rgba(255,71,87,0.5);}
}
.heart-text {position:absolute; font-size:2rem; font-weight:bold; color:white; z-index:2; text-shadow:0 0 8px rgba(0,0,0,0.8);
             font-family:'ZCOOL QingKe HuangYou', sans-serif;}

/* 名字卡片 */
.names-container {display:flex; justify-content:center; gap:40px; margin:30px 0; flex-wrap:wrap; width:100%; max-width:800px; position:relative; z-index:15;}
.name-card {perspective:800px; width:180px; height:220px; flex:0 0 auto; cursor:pointer; position:relative; z-index:15;}
.name-card-inner {position:relative; width:100%; height:100%; text-align:center; transition:transform 0.8s; transform-style:preserve-3d; border-radius:15px;}
.name-card.flipped .name-card-inner {transform:rotateY(180deg);}
.name-card-front, .name-card-back {position:absolute; width:100%; height:100%; -webkit-backface-visibility:hidden; backface-visibility:hidden; border-radius:15px;
                                    display:flex; flex-direction:column; align-items:center; justify-content:center; padding:15px; box-shadow:0 5px 20px rgba(0,0,0,0.3); overflow:hidden;}
.name-card-front {background:linear-gradient(45deg,#3498db,#8e44ad); color:white;}
.name-card-back {background:linear-gradient(45deg,#e74c3c,#f1c40f); color:white; transform:rotateY(180deg);}
.name-icon {font-size:3.5rem; margin-bottom:15px;}
.name {font-size:2.2rem; font-weight:bold; font-family:'Ma Shan Zheng', cursive;}

/* 消息框 */
.message {font-size:1.5rem; line-height:1.8; margin:30px auto; max-width:90%; padding:30px; background: rgba(10,15,40,0.85); border-radius:20px; border:1px solid rgba(255,255,255,0.2);
          opacity:0; animation:fadeInUp 1.5s ease forwards 1.5s; position:relative; overflow:hidden; width:100%; max-width:800px; z-index:15; box-shadow:0 10px 30px rgba(0,0,0,0.3);}
.message-text {font-family:'ZCOOL QingKe HuangYou', sans-serif; position:relative; z-index:2;}
.message:before {content:""; position:absolute; top:0; left:-100%; width:100%; height:100%; background:linear-gradient(90deg,transparent, rgba(255,255,255,0.1),transparent); transition:0.5s; z-index:1;}
.message:hover:before, .message:active:before {left:100%;}

/* 页脚 */
.footer {margin-top:30px; font-size:1.2rem; color:#a8e6cf; opacity:0; animation:fadeIn 2s ease forwards 2s; padding:0 10px; text-align:center; width:100%; position:relative; z-index:15;}
@keyframes fadeInUp {from {opacity:0; transform:translateY(30px);} to {opacity:1; transform:translateY(0);}}
@keyframes fadeIn {from {opacity:0;} to {opacity:1;}}

/* 漂浮爱心 */
.floating-hearts {position:fixed; width:100%; height:100%; top:0; left:0; pointer-events:none; z-index:2;}
.floating-heart {position:absolute; color:#ff4757; font-size:18px; opacity:0; animation:floatUp 15s ease-in-out infinite; will-change:transform,opacity;}
@keyframes floatUp {
    0% {transform:translateY(100vh) translateX(0) rotate(0deg); opacity:0;}
    10% {opacity:0.8;}
    25% {transform:translateY(75vh) translateX(20px) rotate(45deg);}
    50% {transform:translateY(50vh) translateX(-20px) rotate(90deg);}
    75% {transform:translateY(25vh) translateX(10px) rotate(135deg);}
    90% {opacity:0.6;}
    100% {transform:translateY(-10vh) translateX(0) rotate(180deg); opacity:0;}
}

/* 返回顶部 */
.back-to-top {position:fixed; bottom:20px; right:20px; width:50px; height:50px; background-color:rgba(229,46,113,0.8); border-radius:50%;
               display:flex; align-items:center; justify-content:center; color:white; font-size:1.5rem; z-index:100; opacity:0; visibility:hidden; transition:opacity 0.3s,visibility 0.3s; cursor:pointer; box-shadow:0 4px 15px rgba(0,0,0,0.2);}
.back-to-top.visible {opacity:1; visibility:visible;}
.back-to-top:active {transform:scale(0.95);}

/* Loading */
.loading {position:fixed; top:0; left:0; width:100%; height:100%; background:linear-gradient(135deg,#0f0c29,#302b63,#24243e); display:flex; align-items:center; justify-content:center; z-index:9999; transition:opacity 0.5s ease;}
.loading-spinner {width:60px; height:60px; border:5px solid rgba(255,255,255,0.3); border-radius:50%; border-top-color:#ff4757; animation:spin 1s ease-in-out infinite;}
@keyframes spin {to{transform:rotate(360deg);}}

/* 移动端适配 */
@media screen and (max-width: 768px) {
    .container { padding: 10px; }
    .title { font-size: 2.8rem; margin-bottom: 10px; }
    .subtitle { font-size: 1.2rem; }
    
    /* 缩小中间爱心 */
    .heart-container { transform: scale(0.8); margin: 10px auto; }
    
    /* 计时器调整 */
    /* .timer-container { margin: 15px 0; } 删除旧样式引用 */
    /* #love-timer { font-size: 1.4rem !important; } 删除旧样式引用 */
    
    /* 卡片容器调整 */
    .names-container { 
        gap: 15px; 
        margin: 20px 0; 
        flex-direction: row; /* 强制横向排列，如果是小屏手机会自动换行吗？下面调整卡片大小使其能并排 */
        flex-wrap: wrap;
        justify-content: center;
    }
    
    /* 调整卡片大小以适应并排显示 (大多数手机宽约360-390px) */
    .name-card { 
        width: 155px; 
        height: 200px; 
    }
    .name { font-size: 1.8rem; }
    .name-icon { font-size: 2.8rem; }
    
    /* 消息框调整 */
    .message { 
        font-size: 1.1rem; 
        padding: 20px; 
        margin: 20px auto; 
        line-height: 1.6;
    }
    
    /* 粒子数量优化已经在JS中处理，这里处理一些间距 */
    body { padding: 10px; }
}

/* 计时器样式优化 */
.timer-box {
    margin: 30px auto;
    padding: 25px;
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-radius: 20px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
    text-align: center;
    font-family: 'ZCOOL QingKe HuangYou', cursive;
    max-width: 90%;
    width: 600px;
    position: relative;
    z-index: 15;
    animation: fadeInUp 1.5s ease forwards 1s;
    opacity: 0;
}
.timer-title {
    font-size: 1.8rem;
    margin-bottom: 15px;
    background: linear-gradient(to right, #ff8a00, #e52e71);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    letter-spacing: 2px;
}
.timer-digits {
    font-size: 2.2rem;
    font-weight: bold;
    color: #fff;
    text-shadow: 0 0 15px rgba(229, 46, 113, 0.6);
    margin: 10px 0;
    font-family: 'Ma Shan Zheng', cursive; /* 使用书法字体让数字更有韵味，或者换回无衬线体 */
    letter-spacing: 1px;
}
.timer-footer {
    color: #a8e6cf;
    font-size: 1.1rem;
    margin-top: 15px;
    font-weight: 300;
    letter-spacing: 3px;
    opacity: 0.8;
}

@media screen and (max-width: 768px) {
    .timer-box { padding: 15px; margin: 20px auto; }
    .timer-title { font-size: 1.4rem; }
    .timer-digits { font-size: 1.6rem; }
    .timer-footer { font-size: 0.9rem; }
}
</style>
</head>
<body class="no-context-menu">
<div class="loading" id="loading"><div class="loading-spinner"></div></div>
<div class="particles" id="particles"></div>
<div class="floating-hearts" id="floatingHearts"></div>
<div class="container optimized-animation">
  <div class="header">
    <h1 class="title">黎江&蔡艳-情人节快乐!!!</h1>
    <p class="subtitle">一份永恒的爱意，一段美丽的缘分</p>
  </div>
  
  <div class="heart-container">
    <div class="heart"></div>
    <div class="heart-text">L O V E</div>
  </div>
  
  <div class="names-container">
    <div class="name-card" id="card1">
      <div class="name-card-inner">
        <div class="name-card-front">
          <div class="name-icon"><i class="fas fa-user-circle"></i></div>
          <div class="name">黎江</div>
          <p style="margin-top:20px;font-size:1rem;">爱的主语</p>
        </div>
        <div class="name-card-back">
          <div class="name-icon"><i class="fas fa-heart"></i></div>
          <div class="name">挚爱</div>
          <p style="margin-top:20px;font-size:1rem;">一生守护</p>
        </div>
      </div>
    </div>
    
    <div class="name-card" id="card2">
      <div class="name-card-inner">
        <div class="name-card-front">
          <div class="name-icon"><i class="fas fa-user-circle"></i></div>
          <div class="name">蔡艳</div>
          <p style="margin-top:20px;font-size:1rem;">爱的宾语</p>
        </div>
        <div class="name-card-back">
          <div class="name-icon"><i class="fas fa-heart"></i></div>
          <div class="name">被爱</div>
          <p style="margin-top:20px;font-size:1rem;">一生被珍视</p>
        </div>
      </div>
    </div>
  </div>
  
  <div class="timer-box">
    <div class="timer-title">我们结婚已经</div>
    <div id="love-timer" class="timer-digits">
        计算中...
    </div>
    <div class="timer-footer">每一秒都是幸福</div>
  </div>
  
  <div class="message">
    <p class="message-text">从遇见你的那一刻起，我的世界变得完整。<br>你的笑容如阳光般温暖，你的眼眸如星辰般璀璨。<br>黎江对蔡艳的爱，如山川般坚定，如流水般绵长。<br>愿这份爱意穿越时光，永远闪耀在你我心间。</p>
  </div>
  
  <div class="footer">
    <p>❤️ 永恒的爱 · 永恒的承诺 ❤️</p>
    <p style="margin-top:10px;font-size:0.9rem;">Design with love for 黎江 & 蔡艳</p>
  </div>
</div>

<div class="back-to-top" id="backToTop"><i class="fas fa-chevron-up"></i></div>

<div class="music-player" id="musicPlayer" style="position: fixed; bottom: 20px; left: 20px; z-index: 100;">
    <button id="musicBtn" style="width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,0.2); border: 2px solid #fff; color: white; font-size: 20px; cursor: pointer; outline: none; animation: rotate 5s linear infinite paused;">
        <i class="fas fa-music"></i>
    </button>
    <audio id="bgMusic" loop>
        <!-- 请替换为实际的音乐链接 -->
        <source src="https://music.163.com/song/media/outer/url?id=1436709403.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>
</div>

<script>
window.addEventListener('load', function() {
    const loading = document.getElementById('loading');
    loading.style.opacity = '0';
    setTimeout(() => loading.style.display='none', 500);
    initPage();
});

function initPage() {
    const particlesContainer = document.getElementById('particles');
    const floatingHeartsContainer = document.getElementById('floatingHearts');
    const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
    
    // 粒子
    const particleCount = isMobile?50:80;
    for(let i=0;i<particleCount;i++){
        const p = document.createElement('div');
        const size=Math.random()*4+1;
        p.style.width=p.style.height=`${size}px`;
        p.style.backgroundColor=`rgba(${Math.floor(Math.random()*100+155)},${Math.floor(Math.random()*100+155)},${Math.floor(Math.random()*100+155)},${Math.random()*0.3+0.1})`;
        p.style.borderRadius='50%';
        p.style.position='absolute';
        p.style.left=`${Math.random()*100}vw`;
        p.style.top=`${Math.random()*100}vh`;
        const duration=Math.random()*15+10;
        const delay=Math.random()*5;
        p.style.animation=`float ${duration}s linear ${delay}s infinite`;
        p.style.willChange='transform';
        particlesContainer.appendChild(p);
    }

    // 漂浮爱心
    const heartCount = isMobile?15:25;
    for(let i=0;i<heartCount;i++){
        const h = document.createElement('div');
        h.className='floating-heart';
        h.innerHTML='<i class="fas fa-heart"></i>';
        h.style.left=`${Math.random()*100}vw`;
        h.style.animationDelay=`${Math.random()*15}s`;
        h.style.fontSize=`${Math.random()*15+12}px`;
        h.style.color=`hsl(${Math.random()*60+330},100%,70%)`;
        floatingHeartsContainer.appendChild(h);
    }

    // 卡片点击/触摸事件
    const cards = [document.getElementById('card1'),document.getElementById('card2')];
    cards.forEach(card=>{
        let tapped=false;
        card.addEventListener('click', e=>{if(!tapped){card.classList.toggle('flipped'); tapped=true; setTimeout(()=>tapped=false,300);}});
        card.addEventListener('touchstart', e=>{card.classList.toggle('flipped'); e.preventDefault();},{passive:false});
    });

    // 点击页面生成心
    document.addEventListener('click',e=>{createHeart(e.clientX,e.clientY);});
    document.addEventListener('touchstart',e=>{const t=e.touches[0]; createHeart(t.clientX,t.clientY);});

    function createHeart(x,y){
        const clickHeart=document.createElement('div');
        clickHeart.innerHTML='<i class="fas fa-heart"></i>';
        clickHeart.style.position='fixed';
        clickHeart.style.left=`${x}px`;
        clickHeart.style.top=`${y}px`;
        clickHeart.style.color=`hsl(${Math.random()*60+330}, 80%, 60%)`; // 随机一点粉红色调
        clickHeart.style.fontSize='25px';
        clickHeart.style.pointerEvents='none';
        clickHeart.style.zIndex='100';
        clickHeart.style.transform='translate(-50%,-50%)';
        clickHeart.style.opacity='1';
        document.body.appendChild(clickHeart);
        
        const randomX = (Math.random() - 0.5) * 50; // 随机左右飘动
        const randomRotate = (Math.random() - 0.5) * 60; // 随机旋转

        const anim = clickHeart.animate([
            {transform:'translate(-50%,-50%) scale(1) rotate(0deg)', opacity:1},
            {transform:`translate(calc(-50% + ${randomX}px), -100px) scale(1.5) rotate(${randomRotate}deg)`, opacity:0}
        ],{duration:1200, easing:'cubic-bezier(0.25, 1, 0.5, 1)'}); // 更自然的缓动
        
        anim.onfinish=()=>clickHeart.remove();
    }

    // 返回顶部
    const backToTopBtn=document.getElementById('backToTop');
    window.addEventListener('scroll',()=>{if(window.pageYOffset>300) backToTopBtn.classList.add('visible'); else backToTopBtn.classList.remove('visible');});
    backToTopBtn.addEventListener('click',()=>{window.scrollTo({top:0,behavior:'smooth'});});

    // 计时器逻辑
    const startDate = new Date('2012-10-03'); // 结婚纪念日
    function updateTimer() {
        const now = new Date();
        const diff = now - startDate;
        
        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((diff % (1000 * 60)) / 1000);
        
        document.getElementById('love-timer').innerHTML = 
            `${days}天 ${hours}小时 ${minutes}分 ${seconds}秒`;
    }
    setInterval(updateTimer, 1000);
    updateTimer();

    // 音乐播放器逻辑
    const musicBtn = document.getElementById('musicBtn');
    const bgMusic = document.getElementById('bgMusic');
    let isPlaying = false;

    musicBtn.addEventListener('click', (e) => {
        e.stopPropagation(); // 防止触发页面点击生成爱心
        if (isPlaying) {
            bgMusic.pause();
            musicBtn.style.animationPlayState = 'paused';
            musicBtn.innerHTML = '<i class="fas fa-music"></i>';
        } else {
            bgMusic.play().then(() => {
                musicBtn.style.animationPlayState = 'running';
                musicBtn.innerHTML = '<i class="fas fa-pause"></i>';
            }).catch(err => console.log('Playback failed:', err));
        }
        isPlaying = !isPlaying;
    });

    // 尝试自动播放（可能被浏览器拦截）
    document.body.addEventListener('click', function firstClick() {
        if (!isPlaying) {
            bgMusic.play().then(() => {
                isPlaying = true;
                musicBtn.style.animationPlayState = 'running';
                musicBtn.innerHTML = '<i class="fas fa-pause"></i>';
            }).catch(() => {});
            document.body.removeEventListener('click', firstClick);
        }
    }, {once: true});
}
</script>
</body>
</html>
